name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog automation (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Test changelog synchronization and deployment guards
        run: node --test scripts/changelog/*.test.mjs
      - name: Validate reviewed changelog fragments
        run: node scripts/changelog/check.mjs
      - name: Check deployment script syntax
        run: bash -n deploy.sh

  backend:
    name: PHP (tests)
    runs-on: ubuntu-latest
    services:
      bank-mail-test-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BANK_MAIL_CAPTURE_TEST_REDIS: "1"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_CACHE_DB: "1"
      REDIS_PREFIX: bank_mime_capture_ci_
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis
          coverage: none

      - name: Create bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod -R 777 bootstrap/cache

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:'.base64_encode(random_bytes(32)), file_get_contents('.env')));"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup bank-mail verifier runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/bank-mail-verifier/package-lock.json

      - name: Install and test locked bank-mail verifier
        run: |
          npm ci --prefix runtime/bank-mail-verifier --ignore-scripts
          npm test --prefix runtime/bank-mail-verifier
          npm audit --prefix runtime/bank-mail-verifier --omit=dev --audit-level=high

      - name: Check generated API contracts and route coverage
        env:
          APP_ENV: testing
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          LOG_CHANNEL: "null"
          BROADCAST_CONNECTION: "null"
          BTCPAY_BASE_URL: http://127.0.0.1:14142
          BTCPAY_API_KEY: synthetic-api-documentation-key
          BTCPAY_WEBHOOK_BASE_URL: http://localhost
          SEED_FIRST_REGISTRATION: "false"
          COMPLIANCE_SCREENING_ENABLED: "false"
          COMPLIANCE_LIST_SCREENING_ENABLED: "false"
        run: php artisan api-docs:export --check

      - name: Run tests
        run: php artisan test

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Security audit (composer)
        run: composer audit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      # No BTCPay Server and no redis in this job: sqlite + file cache +
      # sync queue, local-first invoicing build, relay sync disabled. The
      # scenarios only cover flows that work against this stack (see
      # docs/E2E_HARNESS.md).
      - name: Prepare environment
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:'.base64_encode(random_bytes(32)), file_get_contents('.env')));"
          sed -i \
            -e 's|^APP_URL=.*|APP_URL=http://localhost:8000|' \
            -e 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' \
            -e 's|^CACHE_STORE=.*|CACHE_STORE=file|' \
            -e 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|' \
            .env
          sed -i '/^DB_HOST=/d;/^DB_PORT=/d;/^DB_DATABASE=/d;/^DB_USERNAME=/d;/^DB_PASSWORD=/d' .env
          {
            echo "DB_DATABASE=${{ github.workspace }}/database/e2e.sqlite"
            echo "VITE_INVOICING_LOCAL_FIRST=true"
            echo "VITE_EVOLU_RELAY_URL="
            echo "BTCPAY_BASE_URL=http://localhost:14142"
            echo "BTCPAY_API_KEY=stub-server-key"
            echo "BTCPAY_WEBHOOK_BASE_URL=http://localhost:8000"
          } >> .env
          # Seed-first off for e2e: the seeded user logs in with a password
          # (an enrolled recovery key would disable password login), and an
          # un-enrolled user under seed-first gets the mandatory migration
          # wizard overlay, which blocks every UI interaction. Replace in
          # place - .env.example sets it to true and dotenv keeps the first
          # definition it sees.
          sed -i 's|^SEED_FIRST_REGISTRATION=.*|SEED_FIRST_REGISTRATION=false|' .env
          # The disposable stub delivers to this exact local callback origin.
          sed -i 's|^BTCPAY_WEBHOOK_PRIVATE_ORIGINS=.*|BTCPAY_WEBHOOK_PRIVATE_ORIGINS=http://localhost:8000|' .env
          mkdir -p bootstrap/cache && chmod -R 777 bootstrap/cache
          touch database/e2e.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Migrate and seed the e2e fixture user
        env:
          E2E_BTCPAY: "1"
          E2E_AUTH_RECOVERY: "1"
        run: |
          php artisan migrate --force
          php artisan db:seed --class=E2eTestSeeder --force

      - name: Start BTCPay Greenfield stub
        env:
          APP_URL: http://localhost:8000
          BTCPAY_STUB_PORT: "14142"
        run: |
          node e2e/btcpay-stub/server.mjs &
          for i in $(seq 1 15); do
            curl -sf http://localhost:14142/_stub/state >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:14142/_stub/state >/dev/null; then
            echo "::error::BTCPay stub failed to start on :14142 within 15s"
            exit 1
          fi

      - name: Start application server
        run: |
          php artisan serve --port=8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/login >/dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:8000/login >/dev/null; then
            echo "::error::Application server failed to start on http://localhost:8000 within 30s"
            exit 1
          fi

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          APP_URL: http://localhost:8000
          E2E_SEEDED_USER: "1"
          E2E_INVOICING_LOCAL_FIRST: "1"
          E2E_BTCPAY: "1"
          E2E_AUTH_RECOVERY: "1"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  frontend:
    name: Node (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI schemas offline
        run: |
          node --test scripts/api-docs/validate.test.mjs
          node scripts/api-docs/validate.mjs

      - name: Security audit (npm, production deps)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Locale parity
        run: npm run test:locale-parity

      - name: Typecheck gate regression tests
        run: node --test scripts/typecheck-baseline.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
